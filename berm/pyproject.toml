[project]
name = "berm"
dynamic = ["version"]
description = "BioElectromagnetic Resonance Model — falsifiable fertility predictions"
requires-python = ">=3.11"
license = {text = "MIT"}
# `import berm` pulls in physics/envelope_psd.py, which needs numpy and scipy;
# they are hard requirements, not extras.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
legacy = [
    "numpy>=1.26",
]
data = [
    "pandas>=2.1",
    "requests>=2.31",
]
dev = ["pytest>=7.4", "ruff>=0.1", "mypy>=1.7"]
full = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.scripts]
berm = "berm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Single source of truth for the package version: berm/__init__.py
[tool.setuptools.dynamic]
version = {attr = "berm.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
