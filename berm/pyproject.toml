[project]
name = "berm"
version = "0.17.0"
description = "BioElectromagnetic Resonance Model — falsifiable fertility predictions"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1", "mypy>=1.7"]
full = [
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "geopandas>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
