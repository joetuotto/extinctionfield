[project]
name = "berm"
version = "0.17.0"
description = "BioElectromagnetic Resonance Model — falsifiable fertility predictions"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
legacy = [
    "numpy>=1.26",
]
data = [
    "pandas>=2.1",
    "requests>=2.31",
]
dev = ["pytest>=7.4", "ruff>=0.1", "mypy>=1.7"]
full = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.scripts]
berm = "berm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
